<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2d3748;
            background: transparent;
            min-height: 100vh;
            padding: 24px;
        }
        [data-theme="dark"] body { color: #e2e8f0; }
        .page-header { margin-bottom: 22px; }
        .page-title { font-size: 1.6rem; font-weight: 700; color: #2d3748; margin-bottom: 6px; }
        [data-theme="dark"] .page-title { color: #e2e8f0; }
        .page-subtitle { font-size: 0.9rem; color: #94a3b8; }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }
        .stat-card {
            background: rgba(139,92,246,0.06);
            border: 1px solid rgba(139,92,246,0.15);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
        }
        .stat-card:nth-child(1)::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
        .stat-card:nth-child(2)::before { background: linear-gradient(90deg, #ec4899, #f472b6); }
        .stat-card:nth-child(3)::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .stat-card:nth-child(4)::before { background: linear-gradient(90deg, #10b981, #34d399); }
        .stat-value {
            font-size: 1.8rem; font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 2px;
        }
        .stat-label { font-size: 0.82rem; color: #94a3b8; font-weight: 500; }

        .card {
            background: rgba(139,92,246,0.04);
            border: 1px solid rgba(139,92,246,0.12);
            border-radius: 14px;
            margin-bottom: 18px;
            overflow: hidden;
        }
        .card-header { padding: 14px 20px; border-bottom: 1px solid rgba(139,92,246,0.1); }
        .card-title { font-size: 1rem; font-weight: 600; color: #2d3748; }
        [data-theme="dark"] .card-title { color: #e2e8f0; }
        .card-body { padding: 16px 20px; }
        .activity-list { list-style: none; }
        .activity-item { padding: 10px 0; border-bottom: 1px solid rgba(139,92,246,0.06); }
        .activity-item:last-child { border-bottom: none; }
        .activity-time { font-size: 0.75rem; color: #a0aec0; margin-bottom: 2px; }
        .activity-content { color: #475569; font-size: 0.88rem; }
        [data-theme="dark"] .activity-content { color: #cbd5e1; }
        .empty-state { text-align: center; padding: 36px 20px; color: #94a3b8; font-size: 0.9rem; }

        .quick-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .quick-link {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 20px;
            background: rgba(139,92,246,0.06);
            border: 1px solid rgba(139,92,246,0.15);
            border-radius: 12px;
            color: #8b5cf6; text-decoration: none; font-size: 0.9rem; font-weight: 500;
            transition: all 0.3s ease;
        }
        .quick-link:hover { background: rgba(139,92,246,0.12); transform: translateY(-2px); }

        @media (max-width: 768px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="page-title">记忆胶囊仪表盘</h1>
        <p class="page-subtitle">记忆、关系、梗百科数据概览</p>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-value" id="stat-memories">0</div>
            <div class="stat-label">总记忆数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-relationships">0</div>
            <div class="stat-label">总关系数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-glossary">0</div>
            <div class="stat-label">梗总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-activities">0</div>
            <div class="stat-label">操作记录</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">快速入口</div>
        </div>
        <div class="card-body">
            <div class="quick-links">
                <a class="quick-link" href="#/plugin-page/astrbot_plugin_memory_capsule/glossary">&#10024; 梗百科</a>
                <a class="quick-link" href="#/plugin-page/astrbot_plugin_memory_capsule/memories">&#9830; 记忆宫殿</a>
                <a class="quick-link" href="#/plugin-page/astrbot_plugin_memory_capsule/relationships">&#10070; 关系图谱</a>
                <a class="quick-link" href="#/plugin-page/astrbot_plugin_memory_capsule/settings">&#9881; 系统设置</a>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">最近活动 <span style="font-size:12px;font-weight:400;color:#a0aec0;">(最新30条)</span></div>
        </div>
        <div class="card-body">
            <ul class="activity-list" id="activity-list">
                <li class="activity-item"><div class="activity-content">加载中...</div></li>
            </ul>
        </div>
    </div>

    <script type="module">
        const bridge = window.AstrBotPluginPage;
        await bridge.ready();

        async function apiGet(endpoint, params) { return bridge.apiGet(endpoint, params); }

        function escapeHtml(s) {
            return (s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function loadDashboard() {
            try {
                const stats = await apiGet('api/stats');
                document.getElementById('stat-memories').textContent = stats.memories || 0;
                document.getElementById('stat-relationships').textContent = stats.relationships || 0;
                document.getElementById('stat-activities').textContent = stats.activities || 0;
            } catch (e) { console.error('加载统计失败:', e); }

            try {
                const gstats = await apiGet('api/glossary/stats');
                document.getElementById('stat-glossary').textContent = gstats.total || 0;
            } catch (e) { console.error('加载梗统计失败:', e); }

            try {
                const acts = await apiGet('api/activities', { limit: 30 });
                const list = document.getElementById('activity-list');
                if (!acts.activities || !acts.activities.length) {
                    list.innerHTML = '<li class="activity-item"><div class="activity-content">暂无活动记录</div></li>';
                } else {
                    list.innerHTML = acts.activities.map(a => `
                        <li class="activity-item">
                            <div class="activity-time">${escapeHtml(a.created_at || '')}</div>
                            <div class="activity-content">${escapeHtml(a.activity_type || '')} ${escapeHtml(a.description || '')}</div>
                        </li>
                    `).join('');
                }
            } catch (e) { console.error('加载活动失败:', e); }
        }

        await loadDashboard();
    </script>
</body>
</html>
