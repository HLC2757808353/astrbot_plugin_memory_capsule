<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关系图谱</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2d3748;
            background: transparent;
            min-height: 100vh;
            padding: 24px;
        }
        [data-theme="dark"] body { color: #e2e8f0; }
        .page-header { margin-bottom: 22px; }
        .page-title { font-size: 1.6rem; font-weight: 700; color: #2d3748; margin-bottom: 6px; }
        [data-theme="dark"] .page-title { color: #e2e8f0; }
        .page-subtitle { font-size: 0.9rem; color: #94a3b8; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .search-box {
            flex: 1; min-width: 220px;
            padding: 10px 16px;
            background: rgba(139,92,246,0.05);
            border: 1px solid rgba(139,92,246,0.15);
            border-radius: 10px;
            color: #2d3748; font-size: 0.92rem;
            transition: all 0.3s ease;
        }
        [data-theme="dark"] .search-box { color: #e2e8f0; background: rgba(255,255,255,0.05); }
        .search-box:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
        .search-box::placeholder { color: #a0aec0; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 16px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 0.88rem; font-weight: 500;
            transition: all 0.3s ease; color: #fff;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-primary { background: linear-gradient(135deg, #8b5cf6, #a78bfa); box-shadow: 0 4px 12px rgba(139,92,246,0.3); }
        .btn-outline { background: rgba(255,255,255,0.6); color: #8b5cf6; border: 1px solid rgba(139,92,246,0.3); }
        .btn-outline:hover { background: rgba(139,92,246,0.08); }
        [data-theme="dark"] .btn-outline { background: rgba(255,255,255,0.06); color: #a78bfa; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #f87171); box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
        .btn-sm { padding: 7px 12px; font-size: 0.8rem; }

        .rel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        .rel-card {
            background: rgba(139,92,246,0.04);
            border: 1px solid rgba(139,92,246,0.12);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .rel-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: linear-gradient(to bottom, #8b5cf6, #ec4899);
            opacity: 0; transition: opacity 0.3s ease;
        }
        .rel-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(139,92,246,0.12); }
        .rel-card:hover::before { opacity: 1; }
        .rel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; flex-wrap: wrap; }
        .rel-nickname { font-size: 1rem; font-weight: 700; color: #2d3748; }
        [data-theme="dark"] .rel-nickname { color: #e2e8f0; }
        .rel-type {
            font-size: 0.75rem; color: #8b5cf6; font-weight: 600;
            background: rgba(139,92,246,0.1); padding: 3px 9px; border-radius: 8px;
        }
        .rel-user-id { font-size: 0.72rem; color: #94a3b8; margin-bottom: 8px; word-break: break-all; }
        .rel-summary { font-size: 0.88rem; color: #475569; margin-bottom: 8px; line-height: 1.6; }
        [data-theme="dark"] .rel-summary { color: #cbd5e1; }
        .rel-notes {
            font-size: 0.82rem; color: #ec4899; background: rgba(236,72,153,0.06);
            padding: 6px 10px; border-radius: 8px; margin-bottom: 8px;
        }
        .rel-meta { font-size: 0.75rem; color: #a0aec0; margin-bottom: 10px; }
        .rel-actions { display: flex; gap: 8px; justify-content: flex-end; }

        .empty-state { text-align: center; padding: 48px 20px; color: #94a3b8; font-size: 0.95rem; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button {
            padding: 7px 12px; background: rgba(255,255,255,0.6);
            border: 1px solid rgba(139,92,246,0.15); border-radius: 9px;
            color: #64748b; cursor: pointer; transition: all 0.3s ease; font-size: 0.82rem;
        }
        [data-theme="dark"] .pagination button { background: rgba(255,255,255,0.05); color: #94a3b8; }
        .pagination button:hover { background: rgba(139,92,246,0.08); border-color: #8b5cf6; color: #8b5cf6; }
        .pagination button.active { background: linear-gradient(135deg, #8b5cf6, #a78bfa); color: #fff; border-color: transparent; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .pagination .page-info { font-size: 0.82rem; color: #94a3b8; margin-left: 8px; }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        }
        .modal.show { display: flex; align-items: center; justify-content: center; animation: fadeIn 0.3s ease; }
        .modal-content {
            background: #fff; border: 1px solid rgba(139,92,246,0.12); border-radius: 14px;
            padding: 26px; width: 90%; max-width: 560px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); animation: slideUp 0.3s ease;
            max-height: 88vh; overflow-y: auto;
        }
        [data-theme="dark"] .modal-content { background: #1e293b; }
        .modal-header { padding-bottom: 14px; border-bottom: 1px solid rgba(139,92,246,0.1); margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.1rem; font-weight: 600; color: #2d3748; }
        [data-theme="dark"] .modal-title { color: #e2e8f0; }
        .modal-close { background: rgba(139,92,246,0.08); border: none; width: 30px; height: 30px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; color: #8b5cf6; }
        .modal-close:hover { background: rgba(139,92,246,0.15); }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 0.82rem; color: #64748b; font-weight: 500; margin-bottom: 5px; }
        [data-theme="dark"] .form-label { color: #94a3b8; }
        .form-control {
            width: 100%; padding: 9px 12px;
            background: rgba(139,92,246,0.04); border: 1px solid rgba(139,92,246,0.15);
            border-radius: 9px; color: #2d3748; font-size: 0.88rem; transition: all 0.3s ease;
        }
        [data-theme="dark"] .form-control { color: #e2e8f0; background: rgba(255,255,255,0.05); }
        .form-control:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
        textarea.form-control { min-height: 70px; resize: vertical; font-family: inherit; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(139,92,246,0.1); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .rel-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="page-title">关系图谱</h1>
        <p class="page-subtitle">记录每个重要人物的人际档案</p>
    </div>

    <div class="toolbar">
        <input type="text" class="search-box" id="search-box" placeholder="搜索昵称 / 用户ID / 关系 / 印象...">
        <button class="btn btn-primary btn-sm" onclick="addRelation()">+ 添加关系</button>
        <button class="btn btn-outline btn-sm" onclick="loadRelations(currentPage)">刷新</button>
    </div>

    <div class="rel-grid" id="rel-grid"></div>
    <div class="pagination" id="pagination"></div>

    <!-- 编辑 Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="edit-modal-title">添加关系</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">用户 ID *</label>
                <input type="text" class="form-control" id="edit-user-id" placeholder="对方唯一ID（群里的ID）">
            </div>
            <div class="form-group">
                <label class="form-label">称呼 / 昵称</label>
                <input type="text" class="form-control" id="edit-nickname" placeholder="如：小明">
            </div>
            <div class="form-group">
                <label class="form-label">关系类型</label>
                <input type="text" class="form-control" id="edit-rel-type" placeholder="如：朋友 / 同事 / 家人">
            </div>
            <div class="form-group">
                <label class="form-label">印象总结</label>
                <textarea class="form-control" id="edit-summary" placeholder="如：性格开朗，Java后端开发，喜欢猫咪"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">备注 / 约定</label>
                <textarea class="form-control" id="edit-notes" placeholder="如：每周五一起打球"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">初次见面地点</label>
                <input type="text" class="form-control" id="edit-first-met" placeholder="如：技术交流群">
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger btn-sm" id="edit-delete-btn" style="display:none; margin-right:auto;" onclick="deleteCurrent()">删除</button>
                <button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button>
                <button class="btn btn-primary btn-sm" onclick="saveRelation()">保存</button>
            </div>
        </div>
    </div>

    <script type="module">
        const bridge = window.AstrBotPluginPage;
        await bridge.ready();

        let currentPage = 1;
        const PAGE_SIZE = 12;
        let currentRelations = [];
        let editingUserId = null;

        async function apiGet(endpoint, params) { return bridge.apiGet(endpoint, params); }
        async function apiPost(endpoint, body) { return bridge.apiPost(endpoint, body); }

        function escapeHtml(s) {
            return (s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function loadRelations(page = 1) {
            currentPage = page;
            const q = document.getElementById('search-box').value.trim();
            try {
                let data;
                if (q) {
                    const resp = await apiGet('api/relationships/search', { q });
                    currentRelations = resp.results || [];
                    renderRelations(currentRelations);
                    document.getElementById('pagination').innerHTML = `<span class="page-info">共 ${currentRelations.length} 条</span>`;
                } else {
                    data = await apiGet('api/relationships', { page, limit: PAGE_SIZE });
                    currentRelations = data.relationships || [];
                    renderRelations(currentRelations);
                    renderPagination(data.total, data.total_pages);
                }
            } catch (e) {
                console.error('加载关系失败:', e);
                document.getElementById('rel-grid').innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }

        function renderRelations(rels) {
            const grid = document.getElementById('rel-grid');
            if (!rels.length) {
                grid.innerHTML = '<div class="empty-state">暂无关系记录，点击"添加关系"开始记录吧</div>';
                return;
            }
            grid.innerHTML = rels.map(r => `
                <div class="rel-card">
                    <div class="rel-header">
                        <span class="rel-nickname">${escapeHtml(r.nickname || '未记录名称')}</span>
                        <span class="rel-type">${escapeHtml(r.relation_type || 'friend')}</span>
                    </div>
                    <div class="rel-user-id">ID: ${escapeHtml(r.user_id)}</div>
                    ${r.summary ? `<div class="rel-summary">${escapeHtml(r.summary)}</div>` : ''}
                    ${r.notes ? `<div class="rel-notes">&#128276; ${escapeHtml(r.notes)}</div>` : ''}
                    <div class="rel-meta">
                        ${r.first_met_location ? `初识于 ${escapeHtml(r.first_met_location)}` : ''}
                        ${r.interaction_count ? ` · 互动 ${r.interaction_count} 次` : ''}
                    </div>
                    <div class="rel-actions">
                        <button class="btn btn-outline btn-sm" onclick="editRelation('${escapeHtml(r.user_id)}')">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteRelation('${escapeHtml(r.user_id)}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function renderPagination(total, totalPages) {
            const el = document.getElementById('pagination');
            if (totalPages <= 1) { el.innerHTML = `<span class="page-info">共 ${total} 条</span>`; return; }
            let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="loadRelations(${currentPage - 1})">上一页</button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="loadRelations(${i})">${i}</button>`;
                } else if (Math.abs(i - currentPage) === 3) {
                    html += `<button disabled>...</button>`;
                }
            }
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="loadRelations(${currentPage + 1})">下一页</button>`;
            html += `<span class="page-info">共 ${total} 条</span>`;
            el.innerHTML = html;
        }

        function addRelation() {
            editingUserId = null;
            document.getElementById('edit-user-id').value = '';
            document.getElementById('edit-nickname').value = '';
            document.getElementById('edit-rel-type').value = '';
            document.getElementById('edit-summary').value = '';
            document.getElementById('edit-notes').value = '';
            document.getElementById('edit-first-met').value = '';
            document.getElementById('edit-delete-btn').style.display = 'none';
            document.getElementById('edit-modal-title').textContent = '添加关系';
            document.getElementById('edit-modal').classList.add('show');
        }

        function editRelation(userId) {
            editingUserId = userId;
            const r = currentRelations.find(x => x.user_id === userId);
            if (!r) return;
            document.getElementById('edit-user-id').value = r.user_id || '';
            document.getElementById('edit-nickname').value = r.nickname || '';
            document.getElementById('edit-rel-type').value = r.relation_type || '';
            document.getElementById('edit-summary').value = r.summary || '';
            document.getElementById('edit-notes').value = r.notes || '';
            document.getElementById('edit-first-met').value = r.first_met_location || '';
            document.getElementById('edit-delete-btn').style.display = 'inline-flex';
            document.getElementById('edit-modal-title').textContent = '编辑关系';
            document.getElementById('edit-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('show');
            editingUserId = null;
        }

        async function saveRelation() {
            const userId = document.getElementById('edit-user-id').value.trim();
            if (!userId) { alert('用户ID不能为空'); return; }
            const payload = {
                user_id: userId,
                nickname: document.getElementById('edit-nickname').value,
                relation_type: document.getElementById('edit-rel-type').value,
                summary: document.getElementById('edit-summary').value,
                notes: document.getElementById('edit-notes').value,
                first_met_location: document.getElementById('edit-first-met').value
            };
            try {
                await apiPost('api/relationships', payload);
                closeModal();
                loadRelations(currentPage);
            } catch (e) { alert('保存失败: ' + e.message); }
        }

        async function deleteCurrent() {
            if (!editingUserId) return;
            if (!confirm('确定删除该关系？')) return;
            try {
                await apiPost(`api/relationships/${encodeURIComponent(editingUserId)}/delete`, {});
                closeModal();
                loadRelations(currentPage);
            } catch (e) { alert('删除失败: ' + e.message); }
        }

        async function deleteRelation(userId) {
            if (!confirm('确定删除该关系？')) return;
            try {
                await apiPost(`api/relationships/${encodeURIComponent(userId)}/delete`, {});
                loadRelations(currentPage);
            } catch (e) { alert('删除失败: ' + e.message); }
        }

        let searchTimer = null;
        document.getElementById('search-box').addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadRelations(1), 400);
        });

        document.getElementById('edit-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        window.loadRelations = loadRelations;
        window.addRelation = addRelation;
        window.editRelation = editRelation;
        window.closeModal = closeModal;
        window.saveRelation = saveRelation;
        window.deleteRelation = deleteRelation;
        window.deleteCurrent = deleteCurrent;

        await loadRelations(1);
    </script>
</body>
</html>
